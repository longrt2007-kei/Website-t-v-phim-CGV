services:
  - type: web
    name: cgv-cinemas-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run api
    healthCheckPath: /movies
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        value: https://cgv-cinemas-api.onrender.com
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
