# Cấu hình Render để triển khai riêng API lưu tài khoản và vé.
services:
  - type: web
    name: cgv-cinemas-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run api
    healthCheckPath: /movies
    envVars:
      # Render tự tạo khóa ký JWT cho môi trường triển khai.
      - key: JWT_SECRET
        generateValue: true
